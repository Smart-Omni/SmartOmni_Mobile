# =============================================================================
# CD MỨC 2 - Gửi APK cho tester qua Firebase App Distribution (miễn phí).
# ĐANG TẮT. Bật theo docs/CICD.md mục "Bật mức 2":
#   1. Tạo các Secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, FIREBASE_APP_ID_ANDROID_STAGING,
#      FIREBASE_SERVICE_ACCOUNT_JSON
#   2. Tạo Variable: ENABLE_FIREBASE_DISTRIBUTION = true
# =============================================================================
name: Distribute (Firebase)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    if: vars.ENABLE_FIREBASE_DISTRIBUTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo keystore từ GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get

      - name: Build APK staging
        run: flutter build apk --release --flavor staging -t lib/main_staging.dart --build-number=${{ github.run_number }}

      - name: Gửi lên Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-staging-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}
