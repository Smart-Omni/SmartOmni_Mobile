# =============================================================================
# PHÁT HÀNH - chạy khi tạo tag phiên bản, ví dụ:
#   git tag v0.1.0 && git push origin v0.1.0
#
# - Job "github-release" (BẬT sẵn, miễn phí): build APK prod và đính kèm vào
#   GitHub Release để ai cũng tải được.
#   + Tag v0.x (bản demo): build với USE_MOCK=true (dữ liệu mẫu, có tài khoản
#     demo), Release đánh dấu pre-release kèm ghi chú "Bản demo…".
#   + Tag từ v1.x: bản prod gọi API thật, Release thường.
# - Job "google-play" (CD MỨC 3, ĐANG TẮT): đẩy AAB lên Google Play kênh Internal.
#   Cần tài khoản Google Play Console (phí 25 USD một lần). Xem docs/CICD.md.
#   Không chạy cho tag v0.x (bản demo không lên Play).
# =============================================================================
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # để tạo GitHub Release

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Tag v0.x = bản demo chạy dữ liệu mẫu.
      DEMO: ${{ startsWith(github.ref, 'refs/tags/v0.') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Nếu đã cấu hình secret keystore -> ký thật; nếu chưa -> ký debug (vẫn cài được).
      - name: Tạo keystore (nếu có)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get

      - name: Build APK prod
        run: >-
          flutter build apk --release --flavor prod -t lib/main_prod.dart
          --build-number=${{ github.run_number }}
          ${{ env.DEMO == 'true' && '--dart-define=USE_MOCK=true' || '' }}

      - name: Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-prod-release.apk
          generate_release_notes: true
          prerelease: ${{ env.DEMO == 'true' }}
          body: ${{ env.DEMO == 'true' && 'Bản demo, chạy dữ liệu mẫu, đăng nhập bằng tài khoản demo.' || '' }}

  google-play:
    if: >-
      vars.ENABLE_PLAY_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/')
      && !startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get

      - name: Build App Bundle (AAB) prod
        run: flutter build appbundle --release --flavor prod -t lib/main_prod.dart --build-number=${{ github.run_number }}

      - name: Upload lên Google Play (Internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.smartomni.mobile
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: draft
